site_name: Zig for Mere Mortals
site_description: A small language for the jobs C used to own, taught from the first compile. Values and types with nothing hidden, errors a program must come to terms with, work done while the compiler runs, a build system written in the language itself, and a C compiler riding along, all of it run for real in the lab.
site_url: https://paulsullivan33-dev.github.io/zig-for-mere-mortals/
